defaults:
  year: latest

filters:
  roe_min:
    column: return_on_equity_pct
    operator: ">="

  de_max:
    column: debt_to_equity
    operator: "<="

  fcf_min:
    column: free_cash_flow_cr
    operator: ">"

  revenue_cagr_5yr_min:
    column: revenue_cagr_5yr
    operator: ">="

  pat_cagr_5yr_min:
    column: pat_cagr_5yr
    operator: ">="

  opm_min:
    column: operating_profit_margin_pct
    operator: ">="

  pe_max:
    column: pe_ratio
    operator: "<="

  pb_max:
    column: pb_ratio
    operator: "<="

  dividend_yield_min:
    column: dividend_yield_pct
    operator: ">="

  icr_min:
    column: interest_coverage
    operator: ">="

  market_cap_min:
    column: market_cap_crore
    operator: ">="

  net_profit_min:
    column: net_profit
    operator: ">="

  eps_cagr_min:
    column: eps_cagr_5yr
    operator: ">="

  asset_turnover_min:
    column: asset_turnover
    operator: ">="

  sales_min:
    column: sales
    operator: ">="


presets:

  quality_compounder:
    display_name: Quality Compounder
    thresholds:
      roe_min: 15
      de_max: 1.0
      fcf_min: 0
      revenue_cagr_5yr_min: 10
    sort_by: composite_quality_score
    ascending: false

  value_pick:
    display_name: Value Pick
    thresholds:
      pe_max: 20
      pb_max: 3.0
      de_max: 2.0
      dividend_yield_min: 1
    sort_by: composite_quality_score
    ascending: false

  growth_accelerator:
    display_name: Growth Accelerator
    thresholds:
      pat_cagr_5yr_min: 20
      revenue_cagr_5yr_min: 15
      de_max: 2.0
    sort_by: composite_quality_score
    ascending: false

  dividend_champion:
    display_name: Dividend Champion
    thresholds:
      dividend_yield_min: 2
      dividend_payout_max: 80
      fcf_min: 0
    sort_by: composite_quality_score
    ascending: false

  debt_free_blue_chip:
    display_name: Debt-Free Blue Chip
    thresholds:
      de_exact: 0
      roe_min: 12
      sales_min: 5000
    sort_by: composite_quality_score
    ascending: false

  turnaround_watch:
    display_name: Turnaround Watch
    thresholds:
      revenue_cagr_3yr_min: 10
      fcf_min: 0
      de_declining: true
    sort_by: composite_quality_score
    ascending: false


composite_score:
  profitability:
    weight: 35
    roe:
      weight: 15
    roce:
      weight: 10
    npm:
      weight: 10

  cash_quality:
    weight: 30
    fcf_cagr_5yr:
      weight: 15
    cfo_pat_ratio:
      weight: 10
    fcf_positive:
      weight: 5

  growth:
    weight: 20
    revenue_cagr_5yr:
      weight: 10
    pat_cagr_5yr:
      weight: 10

  leverage:
    weight: 15
    de:
      weight: 10
    icr:
      weight: 5

normalization:
  lower_percentile: 10
  upper_percentile: 90
  minimum_score: 0
  maximum_score: 100